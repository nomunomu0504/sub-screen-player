<!doctype html>
<!--
  sub-screen-player screen gallery: "claude-code".
  How much Claude Code you have used: the tokens of the current 5-hour block, when it ends,
  today's total and a bar for each minute of the last hour, read from the daemon's
  `claude-code` metric (Claude Code's local logs; nothing leaves your computer). Made for a
  1920x462 panel:

    ssp web https://subscreen.dev/screens/claude-code/

  Shown with `ssp web`, the page gets `window.ssp = { api, token }` and reads your own
  figures; opened in a browser, it shows example figures.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=462">
<title>Claude Code — sub-screen-player screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root { --bg: #05070b; --panel: #0b0f17; --line: #1c2431; --text: #f0f2f8; --muted: #8591a3;
    --accent: #6ee7b7; --accent-dim: rgba(110, 231, 183, 0.32); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  main { display: grid; grid-template-columns: 640px 1fr 300px; gap: 40px; height: 100vh; padding: 40px 48px; }
  .usage { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .label { font-size: 24px; letter-spacing: 4px; color: var(--accent); }
  .value { font-size: 176px; font-weight: 700; letter-spacing: -6px; line-height: 0.95; font-variant-numeric: tabular-nums; }
  .unit { font-size: 30px; color: var(--muted); }
  .detail { font-size: 30px; color: var(--text); }
  .chart { display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0;
    padding: 30px 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; }
  .chart-head { display: flex; justify-content: space-between; font-size: 20px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 250px; }
  .bars i { flex: 1; min-height: 3px; border-radius: 3px 3px 0 0; background: var(--accent-dim); transition: height .5s ease; }
  .bars i:last-child { background: var(--accent); }
  .axis { display: flex; justify-content: space-between; font-size: 18px; color: var(--muted); }
  .clock { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 8px; }
  .time { font-size: 96px; font-weight: 700; letter-spacing: -3px; line-height: 1; font-variant-numeric: tabular-nums; }
  .date { font-size: 24px; color: var(--muted); }
  .stale { opacity: 0.45; }
  .note { font-size: 22px; color: var(--muted); }
  .demo { position: fixed; right: 14px; bottom: 8px; font-size: 14px; color: var(--muted); opacity: .7; }
</style>
</head>
<body>
<main>
  <section class="usage" id="usage">
    <div class="label">CLAUDE CODE</div>
    <div class="value" id="value">--</div>
    <div class="unit">tokens in this 5-hour block</div>
    <div class="detail" id="detail"></div>
  </section>
  <section class="chart">
    <div class="chart-head"><span>tokens per minute, last hour</span><span id="peak"></span></div>
    <div class="bars" id="bars"></div>
    <div class="axis"><span>60 min ago</span><span>now</span></div>
  </section>
  <section class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </section>
</main>
<div class="demo" id="demo" hidden>example figures · ssp web https://subscreen.dev/screens/claude-code/</div>
<script>
  const $ = (id) => document.getElementById(id);
  const ssp = window.ssp;
  const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 });

  for (let i = 0; i < 60; i++) $('bars').appendChild(document.createElement('i'));

  function show(metric) {
    $('value').textContent = metric.text ?? compact.format(metric.value ?? 0);
    $('detail').textContent = metric.detail || '';
    const history = (metric.history || []).slice(-60);
    const max = Math.max(1, ...history);
    const bars = $('bars').children;
    for (let i = 0; i < 60; i++) {
      const value = history[i - (60 - history.length)] ?? 0;
      bars[i].style.height = `${(100 * value / max).toFixed(1)}%`;
    }
    $('peak').textContent = history.length ? `peak ${compact.format(Math.max(...history))}` : '';
    // An old value (Claude Code idle for long) is dimmed, as on the dashboard.
    $('usage').classList.toggle('stale', !!metric.stale);
  }

  function tick() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    $('time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    $('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  // Example figures for a browser: a busy afternoon.
  function example() {
    const history = Array.from({ length: 60 }, (_, i) =>
      Math.max(0, Math.round(42000 + 38000 * Math.sin(i / 5) + 25000 * Math.sin(i * 1.3) + (i > 40 ? 30000 : 0))));
    return { value: 9240000, detail: 'until 20:00 · today 28.1M', history, stale: false };
  }

  async function update() {
    if (!ssp) { show(example()); return; }
    try {
      const response = await fetch(`${ssp.api}/metrics/claude-code`, { headers: { Authorization: `Bearer ${ssp.token}` } });
      if (response.ok) {
        show(await response.json());
      } else if (response.status === 404) {
        // The daemon starts reading the logs when the metric is first asked for.
        $('detail').innerHTML = '<span class="note">reading Claude Code’s logs…</span>';
      }
    } catch (err) {
      console.error(err);
    }
  }

  // `?clean` leaves the label out (pictures of the screen for the gallery).
  $('demo').hidden = !!ssp || new URLSearchParams(location.search).has('clean');
  tick(); update();
  setInterval(tick, 1000);
  setInterval(update, 10000);
</script>
</body>
</html>
