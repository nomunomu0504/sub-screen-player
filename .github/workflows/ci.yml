name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Lets mise use the repository's mise.toml without an interactive `mise trust`.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Installs the Rust toolchain pinned in mise.toml, so CI matches local builds.
      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: mise run fmt:check

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Release build
        run: mise run build
