<!doctype html>
<!--
  sub-screen-player screen gallery: "system".
  The time with CPU, memory and disk as rings and the network as a graph, read from the
  daemon (GET /system). Made for a 1920x462 panel:

    ssp web https://subscreen.dev/screens/system/

  Shown with `ssp web`, the page gets `window.ssp = { api, token }` and reads your own
  figures; opened in a browser, it shows example figures.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=462">
<title>System — sub-screen-player screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root { --bg: #05070b; --panel: #0b0f17; --line: #1c2431; --text: #f0f2f8; --muted: #8591a3;
    --mint: #6ee7b7; --blue: #60a5fa; --amber: #fbbf24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  main { display: grid; grid-template-columns: 560px 1fr 1fr 1fr 1.35fr; gap: 24px; height: 100vh;
    padding: 36px 44px; }
  .clock { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .time { font-size: 150px; font-weight: 700; letter-spacing: -6px; line-height: 1; font-variant-numeric: tabular-nums; }
  .time .s { color: var(--muted); font-size: 70px; letter-spacing: -2px; margin-left: 10px; }
  .date { font-size: 30px; color: var(--muted); padding-left: 6px; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; }
  .label { font-size: 22px; letter-spacing: 3px; color: var(--muted); }
  .ring { position: relative; width: 230px; height: 230px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 18; }
  .ring .track { stroke: var(--line); }
  .ring .fill { stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ring .num small { font-size: 28px; color: var(--muted); margin-left: 4px; }
  .sub { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .net { align-items: stretch; justify-content: space-between; padding: 26px 28px; }
  .net .rates { display: flex; flex-direction: column; gap: 6px; }
  .rate { display: flex; align-items: baseline; gap: 12px; font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rate .arrow { font-size: 34px; }
  .rate .u { font-size: 24px; color: var(--muted); font-weight: 500; }
  .graph { width: 100%; height: 150px; }
  .graph path { fill: none; stroke-width: 3; stroke-linejoin: round; }
  .demo { position: fixed; right: 14px; bottom: 8px; font-size: 14px; color: var(--muted); opacity: .7; }
</style>
</head>
<body>
<main>
  <section class="clock">
    <div class="time"><span id="hm">--:--</span><span class="s" id="sec">--</span></div>
    <div class="date" id="date"></div>
  </section>
  <section class="panel">
    <div class="label">CPU</div>
    <div class="ring" id="cpu"></div>
    <div class="sub" id="cpu-sub"></div>
  </section>
  <section class="panel">
    <div class="label">MEMORY</div>
    <div class="ring" id="memory"></div>
    <div class="sub" id="memory-sub"></div>
  </section>
  <section class="panel">
    <div class="label">DISK</div>
    <div class="ring" id="disk"></div>
    <div class="sub" id="disk-sub"></div>
  </section>
  <section class="panel net">
    <div class="label" style="align-self: flex-start">NETWORK</div>
    <div class="rates">
      <div class="rate" style="color: var(--mint)"><span class="arrow">↓</span><span id="rx">--</span><span class="u" id="rx-u"></span></div>
      <div class="rate" style="color: var(--blue)"><span class="arrow">↑</span><span id="tx">--</span><span class="u" id="tx-u"></span></div>
    </div>
    <svg class="graph" id="graph" viewBox="0 0 600 150" preserveAspectRatio="none">
      <path id="rx-line" style="stroke: var(--mint)"></path>
      <path id="tx-line" style="stroke: var(--blue)"></path>
    </svg>
  </section>
</main>
<div class="demo" id="demo" hidden>example figures · ssp web https://subscreen.dev/screens/system/</div>
<script>
  const $ = (id) => document.getElementById(id);
  const ssp = window.ssp;
  const R = 101, C = 2 * Math.PI * R;

  // A ring for a share, 0-100, in a color that warns when it is high.
  function ring(id, percent) {
    const color = percent >= 90 ? 'var(--amber)' : 'var(--mint)';
    const offset = C * (1 - Math.min(100, Math.max(0, percent)) / 100);
    const el = $(id);
    if (!el.firstChild) {
      el.innerHTML = `<svg viewBox="0 0 230 230"><circle class="track" cx="115" cy="115" r="${R}"></circle>` +
        `<circle class="fill" cx="115" cy="115" r="${R}" stroke-dasharray="${C}"></circle></svg><div class="num"></div>`;
    }
    const fill = el.querySelector('.fill');
    fill.style.stroke = color;
    fill.style.strokeDashoffset = offset;
    el.querySelector('.num').innerHTML = `${Math.round(percent)}<small>%</small>`;
  }

  const gb = (bytes) => (bytes / 2 ** 30).toFixed(1);
  const tb = (bytes) => bytes >= 1e12 ? `${(bytes / 1e12).toFixed(2)} TB` : `${Math.round(bytes / 1e9)} GB`;
  function rate(perSec) {
    const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
    let unit = 0;
    while (perSec >= 1000 && unit < units.length - 1) { perSec /= 1000; unit++; }
    return [perSec.toFixed(perSec < 10 && unit > 0 ? 1 : 0), units[unit]];
  }

  // The last minute of network rates, as two lines on one scale.
  const history = { rx: [], tx: [] };
  function graph() {
    const max = Math.max(1, ...history.rx, ...history.tx);
    // The newest sample at the right edge.
    const line = (values) => values.map((v, i) =>
      `${i ? 'L' : 'M'}${(600 * (60 - values.length + i) / 59).toFixed(1)},${(146 - 140 * v / max).toFixed(1)}`).join(' ');
    $('rx-line').setAttribute('d', line(history.rx));
    $('tx-line').setAttribute('d', line(history.tx));
  }

  function show(s) {
    ring('cpu', s.cpu_percent);
    $('cpu-sub').textContent = `${s.cpu_count} cores` + (s.load == null ? '' : ` · load ${s.load.toFixed(2)}`);
    const mem = 100 * s.memory_used / s.memory_total;
    ring('memory', mem);
    $('memory-sub').textContent = `${gb(s.memory_used)} / ${gb(s.memory_total)} GB`;
    if (s.disk_total) {
      ring('disk', 100 * s.disk_used / s.disk_total);
      $('disk-sub').textContent = `${tb(s.disk_used)} / ${tb(s.disk_total)}`;
    }
    for (const [key, value] of [['rx', s.rx_per_sec], ['tx', s.tx_per_sec]]) {
      const [n, u] = rate(value);
      $(key).textContent = n;
      $(`${key}-u`).textContent = u;
      history[key].push(value);
      if (history[key].length > 60) history[key].shift();
    }
    graph();
  }

  function tick() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    $('hm').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    $('sec').textContent = pad(now.getSeconds());
    $('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Example figures for a browser, a little different every second.
  let t = 0;
  function example() {
    t++;
    const wave = (base, spread, speed) => base + spread * Math.sin(t / speed) + spread * 0.3 * Math.sin(t * 1.7);
    return { cpu_percent: wave(32, 14, 6), cpu_count: 10, load: 2.4 + Math.sin(t / 9),
      memory_used: 41.2 * 2 ** 30 + 2 ** 29 * Math.sin(t / 15), memory_total: 64 * 2 ** 30,
      rx_per_sec: Math.max(0, wave(2.4e6, 1.6e6, 4)), tx_per_sec: Math.max(0, wave(3.1e5, 2e5, 5)),
      disk_used: 1.31e12, disk_total: 2e12 };
  }

  async function update() {
    if (!ssp) { show(example()); return; }
    try {
      const response = await fetch(`${ssp.api}/system`, { headers: { Authorization: `Bearer ${ssp.token}` } });
      if (response.ok) show(await response.json());
    } catch (err) {
      console.error(err);
    }
  }

  // `?clean` leaves the label out (pictures of the screen for the gallery).
  $('demo').hidden = !!ssp || new URLSearchParams(location.search).has('clean');
  tick(); update();
  setInterval(tick, 1000);
  setInterval(update, 1000);
</script>
</body>
</html>
