name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Lets mise use the repository's mise.toml without an interactive `mise trust`.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Installs the Rust toolchain pinned in mise.toml, so CI matches local builds.
      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: mise run fmt:check

      - name: Lint
        run: mise run lint

      # The web page tests use the browser in SSP_TEST_CHROME: the headless Chrome that
      # `ssp web --install` downloads (the current stable one, which paces pages), and after the
      # tests the runner's Google Chrome, which can be older. Ubuntu 24.04 keeps Chrome's sandbox
      # from starting unless user namespaces are allowed.
      - name: Download headless Chrome
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          chrome=$(mise exec -- cargo run -q --locked -p ssp-server --example install-chrome \
            -- "$RUNNER_TEMP/chrome")
          echo "SSP_TEST_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Test
        run: mise run test

      - name: Web pages with Google Chrome
        shell: bash
        run: |
          for chrome in /usr/bin/google-chrome \
              "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
              "C:/Program Files/Google/Chrome/Application/chrome.exe"; do
            if [ -f "$chrome" ]; then
              SSP_TEST_CHROME="$chrome" mise exec -- cargo test --locked -p ssp-server --lib \
                -- sources::web:: web::cdp::
              exit
            fi
          done
          echo "no Google Chrome on this runner"

      - name: Release build
        run: mise run build

      # `ssp update` with the website's installers (#23): a copy of this build goes to an older
      # release. On Windows this also moves the running ssp.exe aside.
      - name: ssp update
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ssp-update"
          mkdir -p "$dir"
          exe=ssp
          [ "$RUNNER_OS" = Windows ] && exe=ssp.exe
          cp "target/release/$exe" "$dir/$exe"
          "$dir/$exe" update --to v0.7.0
          version=$("$dir/$exe" --version)
          echo "$version"
          [ "$version" = "ssp 0.7.0" ]
