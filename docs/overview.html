<!doctype html>
<!--
  The picture at the top of the READMEs (images/overview.png): screens the display shows, from
  docs/images and the screen gallery (site/src/assets/gallery). Laid out at 1600x900, written at
  2000x1125 from the repository root:

    chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$chrome" --headless --hide-scrollbars --default-background-color=00000000 \
      --window-size=1600,900 --force-device-scale-factor=1.25 \
      --screenshot="$PWD/docs/images/overview.png" "file://$PWD/docs/overview.html"

  Chrome can keep running after it has written the file; stop it then.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>sub-screen-player overview</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: transparent; }
  .canvas {
    width: 1600px;
    height: 900px;
    padding: 46px 48px;
    border-radius: 28px;
    background:
      radial-gradient(ellipse 900px 380px at 50% 28%, rgba(110, 231, 183, 0.13), transparent 70%),
      radial-gradient(ellipse 1100px 460px at 50% 100%, rgba(96, 165, 250, 0.08), transparent 70%),
      #070a10;
  }
  .device {
    padding: 10px;
    border-radius: 18px;
    background: linear-gradient(180deg, #303644 0%, #161a22 55%, #0f1218 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.14),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05),
      0 22px 54px rgba(0, 0, 0, 0.6);
  }
  .device img { display: block; width: 100%; border-radius: 7px; }
  .grid {
    margin-top: 26px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px 24px;
  }
  .grid .device { padding: 8px; border-radius: 15px; }
  .grid .device img { border-radius: 6px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="device"><img src="../site/src/assets/gallery/system.png" alt=""></div>
    <div class="grid">
      <div class="device"><img src="images/layout.png" alt=""></div>
      <div class="device"><img src="../site/src/assets/gallery/weather.png" alt=""></div>
      <div class="device"><img src="images/notify.png" alt=""></div>
      <div class="device"><img src="../site/src/assets/gallery/world-clock.png" alt=""></div>
    </div>
  </div>
</body>
</html>
