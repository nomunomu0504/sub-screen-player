name: Site

# Builds the website (site/) and publishes it. Runs when the site or the docs it includes change,
# and when a release is published (the download page lists the latest release; the run started by
# the release only restarts this workflow on main, see rebuild-on-main).
#
# Where it goes is set by the repository variable SITE_HOST: GitHub Pages when it is not set,
# Cloudflare Workers (site/wrangler.jsonc) as well with "both", Cloudflare only with
# "cloudflare". Cloudflare needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING*.md"
      - "SECURITY*.md"
      - "mise.toml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING*.md"
      - "SECURITY*.md"
      - "mise.toml"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  # A published release changes the download page, but a run started by the release uses the
  # tag as its ref: the github-pages environment only deploys from main, and the tag may also
  # predate later changes to the docs. So start this workflow again on the default branch.
  rebuild-on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: bun

      - name: Build
        env:
          # With a custom domain (repository variable SITE_DOMAIN) the site is served from the
          # root; otherwise from https://<owner>.github.io/<repository>/.
          SITE_URL: ${{ vars.SITE_DOMAIN && format('https://{0}', vars.SITE_DOMAIN) || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.SITE_DOMAIN && '/' || format('/{0}', github.event.repository.name) }}
          # Used to read the latest release for the download page.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run site:build

      - uses: actions/upload-pages-artifact@v5
        if: vars.SITE_HOST != 'cloudflare'
        with:
          path: site/dist

      - uses: actions/upload-artifact@v7
        if: vars.SITE_HOST == 'both' || vars.SITE_HOST == 'cloudflare'
        with:
          name: site
          path: site/dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && vars.SITE_HOST != 'cloudflare'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # The same build on Cloudflare: deployed from main, and as a preview version (with its own URL)
  # for pull requests from this repository.
  cloudflare:
    if: >-
      (vars.SITE_HOST == 'both' || vars.SITE_HOST == 'cloudflare')
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'cloudflare-preview' || 'cloudflare' }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: bun

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/dist

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            bunx wrangler@4 versions upload --preview-alias "pr-$PR" | tee wrangler.log
          else
            bunx wrangler@4 deploy | tee wrangler.log
          fi
          grep -Eo 'https://[^ ]+' wrangler.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  installers:
    name: Installer on ${{ matrix.os }}
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: install.sh
        if: runner.os != 'Windows'
        env:
          SSP_INSTALL_DIR: ${{ runner.temp }}/ssp-bin
        run: |
          sh site/public/install.sh
          "$SSP_INSTALL_DIR/ssp" --version

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SSP_INSTALL_DIR: ${{ runner.temp }}\ssp-bin
        run: |
          Get-Content site/public/install.ps1 -Raw | Invoke-Expression
          & "$env:SSP_INSTALL_DIR\ssp.exe" --version

      - name: install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SSP_INSTALL_DIR: ${{ runner.temp }}\ssp-pwsh
        run: |
          Get-Content site/public/install.ps1 -Raw | Invoke-Expression
          & "$env:SSP_INSTALL_DIR\ssp.exe" --version

      # The command the website shows, run from the Command Prompt against the published script.
      - name: One-line command from cmd
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SSP_INSTALL_DIR: ${{ runner.temp }}\ssp-one-line
          SCRIPT_URL: ${{ vars.SITE_DOMAIN && format('https://{0}', vars.SITE_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}/install.ps1
        run: |
          powershell -c "irm %SCRIPT_URL% | iex"
          "%SSP_INSTALL_DIR%\ssp.exe" --version
